<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0B0F">
<title>Tomo — Mi Manga</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0F;
    --surface:#17171D;
    --surface-2:#1F1F27;
    --text:#F5F3EE;
    --text-soft:#9C9AA5;
    --line:#2A2A33;
    --danger:#FF5470;
    --green:#4ADE9C;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--text);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:88px;
  }
  ::selection{background:var(--green); color:#0B0B0F;}
  :focus-visible{outline:2px solid var(--green); outline-offset:2px;}
  img{max-width:100%;}

  /* ---------- Header ---------- */
  .banner{
    position:relative;
    padding:20px 16px 16px;
    background:
      radial-gradient(120% 140% at 15% -10%, rgba(74,222,156,.16), transparent 55%),
      radial-gradient(120% 140% at 100% 0%, rgba(255,84,112,.14), transparent 55%),
      var(--bg);
  }
  .banner-inner{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .brand{font-family:'Bebas Neue', sans-serif; font-size:38px; letter-spacing:1px; line-height:1;}
  .brand small{
    display:block; font-family:'JetBrains Mono', monospace; font-size:9.5px;
    letter-spacing:3px; color:var(--text-soft); text-transform:uppercase; margin-top:3px;
  }
  .btn-icon{
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:999px; width:40px; height:40px; font-size:17px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .btn-icon:active{transform:scale(.94);}
  .stats-row{display:flex; gap:8px; margin-top:16px; overflow-x:auto; padding-bottom:2px;}
  .stat-chip{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; white-space:nowrap;
    background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:7px 12px;
    color:var(--text-soft);
  }
  .stat-chip b{color:var(--text); font-size:13px; margin-right:4px;}

  /* ---------- Tabs ---------- */
  .tabs{
    position:sticky; top:0; z-index:20;
    display:flex; gap:4px; padding:10px 12px;
    background:rgba(11,11,15,.86); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1; text-align:center; padding:9px 4px;
    font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:.4px;
    text-transform:uppercase; color:var(--text-soft);
    border:1px solid transparent; border-radius:10px; background:transparent;
    position:relative; cursor:pointer;
  }
  .tab.active{color:var(--bg); background:var(--text); font-weight:700;}
  .tab .badge-dot{
    position:absolute; top:5px; right:14%; width:6px; height:6px; border-radius:50%; background:var(--danger);
  }
  .tab.active .badge-dot{background:var(--danger);}

  main{padding:16px 14px 8px; max-width:640px; margin:0 auto;}

  .section-label{
    font-family:'Bebas Neue', sans-serif; font-size:24px; letter-spacing:.4px;
    margin:4px 2px 14px; display:flex; align-items:center; gap:8px;
  }
  .section-label .count{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-soft);
    border:1px solid var(--line); border-radius:20px; padding:2px 9px;
  }
  .section-sub{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--text-soft);
    margin:-8px 2px 16px; line-height:1.5;
  }

  .empty{
    text-align:center; padding:56px 22px; color:var(--text-soft);
    border:1.5px dashed var(--line); border-radius:16px;
  }
  .empty b{display:block; color:var(--text); font-family:'Bebas Neue'; font-size:22px; margin-bottom:6px;}

  /* ---------- Poster grid ---------- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .poster{
    position:relative; border-radius:16px; overflow:hidden; cursor:pointer;
    aspect-ratio:2/3; background:var(--surface);
    border:1px solid var(--line);
    box-shadow:0 0 0 0 transparent;
    transition:box-shadow .2s, transform .2s;
  }
  .poster:active{transform:scale(.97);}
  .poster img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .poster-placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:15px; text-align:center; padding:14px; line-height:1.15;
    color:#fff;
  }
  .poster-scrim{
    position:absolute; left:0; right:0; bottom:0; padding:10px 10px 9px;
    background:linear-gradient(to top, rgba(0,0,0,.92) 10%, rgba(0,0,0,.55) 55%, transparent 100%);
  }
  .poster-title{
    font-weight:700; font-size:12.5px; line-height:1.2; margin:0 0 6px; color:#fff;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .poster-tag{
    display:inline-block; font-family:'JetBrains Mono'; font-size:8.5px; text-transform:uppercase;
    letter-spacing:.3px; padding:2px 6px; border-radius:5px; color:#0B0B0F; font-weight:700;
    margin-bottom:6px;
  }
  .poster-progress{height:4px; border-radius:3px; background:rgba(255,255,255,.22); overflow:hidden;}
  .poster-progress-fill{height:100%;}
  .poster-newchip{
    position:absolute; top:8px; right:8px; background:var(--danger); color:#fff;
    font-family:'JetBrains Mono'; font-size:9px; font-weight:700; padding:3px 7px; border-radius:20px;
  }
  .poster-glow{
    position:absolute; inset:-1px; border-radius:16px; border:2px solid transparent; pointer-events:none;
  }

  /* ---------- Bottom sheet modal ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:51; max-height:88vh;
    background:var(--surface); border-radius:22px 22px 0 0; border-top:1px solid var(--line);
    transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:10px auto 4px;}
  .sheet-scroll{overflow-y:auto; padding:14px 18px 24px;}
  .sheet-head{display:flex; gap:14px; margin-bottom:14px;}
  .sheet-cover{width:88px; height:126px; border-radius:10px; object-fit:cover; background:var(--surface-2);}
  .sheet-title{font-weight:700; font-size:16px; line-height:1.25; margin:0 0 8px;}
  .sheet-close{
    position:absolute; top:12px; right:14px; background:var(--surface-2); border:1px solid var(--line);
    color:var(--text); width:32px; height:32px; border-radius:50%; font-size:15px; cursor:pointer;
  }

  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .tag{
    font-family:'JetBrains Mono'; font-size:9.5px; text-transform:uppercase; letter-spacing:.3px;
    padding:3px 8px; border-radius:20px; border:1px solid var(--line); color:var(--text-soft);
  }
  .newchap{
    display:inline-flex; align-items:center; gap:6px; background:var(--danger); color:#fff;
    font-family:'JetBrains Mono'; font-size:10.5px; font-weight:700; padding:5px 10px;
    border-radius:20px; margin-bottom:8px; border:none; cursor:pointer;
  }

  .vol-hint{font-family:'JetBrains Mono'; font-size:9.5px; color:var(--text-soft); margin:0 0 8px;}
  .vol-grid{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:16px;}
  .vol-sq{
    width:26px; height:30px; border:1.5px solid var(--line); border-radius:5px;
    font-family:'JetBrains Mono'; font-size:9px; display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); color:var(--text-soft); cursor:pointer; user-select:none;
  }
  .vol-sq.owned{background:var(--surface-2); color:var(--text); font-weight:700; border-color:var(--text-soft);}
  .vol-sq.read{color:#0B0B0F; font-weight:700; border-color:transparent;}

  .counter-row{display:flex; gap:10px; margin-bottom:16px;}
  .counter{flex:1; border:1px solid var(--line); border-radius:12px; padding:8px 10px;}
  .counter label{display:block; font-family:'JetBrains Mono'; font-size:9px; color:var(--text-soft); text-transform:uppercase; margin-bottom:6px;}
  .counter-controls{display:flex; align-items:center; justify-content:space-between;}
  .counter-controls button{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text); font-size:15px; line-height:1; cursor:pointer;
  }
  .counter-controls span{font-family:'JetBrains Mono'; font-weight:700;}

  .field-label{font-family:'JetBrains Mono'; font-size:9.5px; text-transform:uppercase; color:var(--text-soft); margin:14px 0 6px; display:block;}
  .date-input, .note-input{
    width:100%; font-family:'Zen Kaku Gothic New'; font-size:13px; padding:9px 11px;
    border:1px solid var(--line); border-radius:10px; background:var(--surface-2); color:var(--text);
  }
  .date-input{font-family:'JetBrains Mono'; margin-bottom:10px;}
  .note-input{margin-top:0;}

  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .sheet-actions button{
    flex:1; padding:12px; border-radius:12px; border:1px solid var(--line);
    font-family:'JetBrains Mono'; font-size:11px; text-transform:uppercase; letter-spacing:.3px;
    background:var(--surface-2); color:var(--text); cursor:pointer;
  }
  .sheet-actions button.primary{background:var(--text); color:var(--bg); border-color:var(--text); font-weight:700;}
  .sheet-actions button.danger{color:var(--danger); border-color:var(--danger);}

  /* ---------- Upcoming ---------- */
  .up-item{
    display:flex; gap:12px; padding:12px; background:var(--surface);
    border:1px solid var(--line); border-radius:14px; margin-bottom:10px;
  }
  .up-item img{width:52px; height:74px; object-fit:cover; border-radius:8px;}
  .up-placeholder{
    width:52px; height:74px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:13px; color:#fff; flex-shrink:0;
  }
  .up-date{font-family:'Bebas Neue'; font-size:20px; line-height:1;}
  .up-date small{display:block; font-family:'JetBrains Mono'; font-size:8.5px; color:var(--text-soft); text-transform:uppercase; margin-top:3px;}
  .up-title{font-weight:700; font-size:13px; margin:4px 0 6px; color:var(--text);}

  /* ---------- Search ---------- */
  .search-bar{display:flex; gap:8px; margin-bottom:16px;}
  .search-bar input{
    flex:1; padding:13px 15px; border:1px solid var(--line); border-radius:12px;
    font-family:'Zen Kaku Gothic New'; font-size:14px; background:var(--surface); color:var(--text);
  }
  .search-bar input::placeholder{color:var(--text-soft);}
  .search-bar button{
    background:var(--green); color:#0B0B0F; border:none; border-radius:12px; padding:0 20px;
    font-family:'Bebas Neue'; font-size:16px; letter-spacing:.5px; cursor:pointer;
  }
  .result-card{
    display:flex; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:10px; margin-bottom:10px; align-items:center;
  }
  .result-card img{width:52px; height:74px; object-fit:cover; border-radius:8px; flex-shrink:0;}
  .result-placeholder{
    width:52px; height:74px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:13px; color:#fff; flex-shrink:0; text-align:center;
  }
  .result-info{flex:1; min-width:0;}
  .result-title{font-weight:700; font-size:13px; margin:0 0 6px; line-height:1.25; color:var(--text);}
  .result-actions{display:flex; gap:6px; margin-top:8px;}
  .mini-btn{
    font-family:'JetBrains Mono'; font-size:9.5px; text-transform:uppercase; padding:6px 10px;
    border-radius:20px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; color:var(--text);
  }
  .mini-btn.solid{background:var(--text); color:var(--bg); border-color:var(--text); font-weight:700;}
  .mini-btn.added{background:var(--green); border-color:var(--green); color:#0B0B0F; font-weight:700;}

  .loading{text-align:center; padding:36px; font-family:'JetBrains Mono'; font-size:12px; color:var(--text-soft);}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:rgba(11,11,15,.92); backdrop-filter:blur(10px);
    display:flex; justify-content:space-around;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .bottomnav button{
    background:transparent; border:none; color:var(--text-soft);
    font-family:'JetBrains Mono'; font-size:9.5px; text-transform:uppercase;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer; padding:4px 8px;
  }
  .bottomnav button.active{color:var(--text);}
  .bottomnav .ic{font-size:18px;}

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:var(--text); color:var(--bg); padding:10px 18px; border-radius:20px;
    font-family:'JetBrains Mono'; font-size:12px; font-weight:700; z-index:99; opacity:0; pointer-events:none;
    transition:opacity .25s, bottom .25s; max-width:86%; text-align:center;
  }
  .toast.show{opacity:1; bottom:114px;}

  .footer-tools{display:flex; gap:10px; justify-content:center; padding:22px 0 6px;}
  .footer-tools button{
    background:none; border:1px solid var(--line); color:var(--text-soft);
    font-family:'JetBrains Mono'; font-size:10px; padding:7px 12px; border-radius:20px; cursor:pointer;
  }
  #fileImport{display:none;}
</style>
</head>
<body>

  <div class="banner">
    <div class="banner-inner">
      <div class="brand">TOMO<small>seguimiento de manga</small></div>
      <button class="btn-icon" id="refreshBtn" title="Actualizar desde AniList" aria-label="Actualizar">⟳</button>
    </div>
    <div class="stats-row" id="statsRow"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="library">Biblioteca</button>
    <button class="tab" data-tab="wishlist">Wishlist</button>
    <button class="tab" data-tab="upcoming">Próximos<span class="badge-dot" id="upcomingDot" style="display:none"></span></button>
    <button class="tab" data-tab="search">Buscar</button>
  </div>

  <main id="main"></main>

  <div class="footer-tools">
    <button id="exportBtn">Exportar copia</button>
    <button id="importBtn">Importar copia</button>
    <input type="file" id="fileImport" accept=".json">
  </div>

  <div class="bottomnav">
    <button class="active" data-tab="library"><span class="ic">📚</span>Biblioteca</button>
    <button data-tab="wishlist"><span class="ic">☆</span>Wishlist</button>
    <button data-tab="upcoming"><span class="ic">🗓</span>Próximos</button>
    <button data-tab="search"><span class="ic">🔍</span>Buscar</button>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div class="sheet-scroll" id="sheetContent"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const STORE_KEY = "tomo_manga_data_v2";
  const ANILIST_URL = "https://graphql.anilist.co";

  /* ---------------- State ---------------- */
  let state = loadState();
  let activeTab = "library";
  let openItemId = null;

  function loadState(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
      const legacy = localStorage.getItem("tomo_manga_data_v1");
      if(legacy) return JSON.parse(legacy);
    }catch(e){ console.warn("No se pudo leer el almacenamiento local", e); }
    return { items: [] };
  }
  function saveState(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }catch(e){
      toast("No se pudo guardar (¿almacenamiento lleno?)");
    }
    renderStats();
  }

  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove("show"), 2200);
  }

  /* ---------------- Color identity per series ---------------- */
  // Cada serie recibe un color propio derivado de su título (determinista),
  // en vez de un único acento fijo para toda la app.
  function hashHue(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
    return h % 360;
  }
  function itemColor(item, opts){
    opts = opts || {};
    const hue = hashHue(String(item.title||item.id));
    const sat = opts.sat || 68;
    const light = opts.light || 56;
    return `hsl(${hue} ${sat}% ${light}%)`;
  }
  function itemColorDark(item){
    const hue = hashHue(String(item.title||item.id));
    return `hsl(${hue} 45% 18%)`;
  }

  /* ---------------- AniList API ---------------- */
  async function anilistQuery(query, variables){
    const res = await fetch(ANILIST_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ query, variables })
    });
    if(!res.ok) throw new Error("AniList error " + res.status);
    const json = await res.json();
    if(json.errors) throw new Error(json.errors[0]?.message || "AniList error");
    return json.data;
  }

  async function searchManga(term){
    const query = `
      query ($search: String) {
        Page(perPage: 12) {
          media(search: $search, type: MANGA, sort: POPULARITY_DESC) {
            id
            title { romaji english native }
            coverImage { large medium }
            status
            format
            volumes
            chapters
            startDate { year month day }
          }
        }
      }`;
    const data = await anilistQuery(query, { search: term });
    return data.Page.media;
  }

  async function fetchMediaById(id){
    const query = `
      query ($id: Int) {
        Media(id: $id, type: MANGA) {
          id
          title { romaji english native }
          coverImage { large medium }
          status
          format
          volumes
          chapters
          startDate { year month day }
        }
      }`;
    const data = await anilistQuery(query, { id });
    return data.Media;
  }

  function bestTitle(t){ return (t && (t.english || t.romaji || t.native)) || "Sin título"; }

  function statusLabel(s){
    return {
      RELEASING: "En emisión", FINISHED: "Completo", NOT_YET_RELEASED: "Aún no publicado",
      CANCELLED: "Cancelado", HIATUS: "En pausa"
    }[s] || s || "—";
  }
  function fmtDate(d){
    if(!d || !d.year) return null;
    const months = ["","ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    return `${d.day || "?"} ${months[d.month]||""} ${d.year}`;
  }

  /* ---------------- Item helpers ---------------- */
  function findItem(id){ return state.items.find(i => i.id === id); }

  function mediaToItem(media){
    return {
      id: media.id,
      title: bestTitle(media.title),
      cover: (media.coverImage && (media.coverImage.large || media.coverImage.medium)) || "",
      status: media.status,
      totalVolumes: media.volumes || null,
      totalChapters: media.chapters || null,
      chaptersKnown: media.chapters || 0,
      startDate: media.startDate && media.startDate.year ? media.startDate : null,
      inLibrary: false,
      inWishlist: false,
      volumeStates: media.volumes && media.volumes <= 200 ? new Array(media.volumes).fill(0) : null,
      ownedCount: 0,
      readCount: 0,
      manualNextDate: "",
      manualNote: "",
      newChaptersCount: 0,
      addedAt: Date.now()
    };
  }

  function addToLibrary(media){
    let item = findItem(media.id);
    if(!item){ item = mediaToItem(media); state.items.push(item); }
    item.inLibrary = true;
    saveState();
    toast(`"${item.title}" añadido a tu biblioteca`);
    render();
  }
  function addToWishlist(media){
    let item = findItem(media.id);
    if(!item){ item = mediaToItem(media); state.items.push(item); }
    item.inWishlist = true;
    saveState();
    toast(`"${item.title}" añadido a la wishlist`);
    render();
  }
  function removeItem(id){
    const item = findItem(id);
    if(!item) return;
    state.items = state.items.filter(i => i.id !== id);
    saveState();
    closeSheet();
    render();
    toast(`"${item.title}" eliminado`);
  }
  function moveToLibrary(id){
    const item = findItem(id);
    item.inLibrary = true;
    item.inWishlist = false;
    saveState();
    toast(`"${item.title}" movido a tu biblioteca`);
    render();
    openSheet(id);
  }

  function cycleVolume(id, idx){
    const item = findItem(id);
    if(!item || !item.volumeStates) return;
    item.volumeStates[idx] = (item.volumeStates[idx] + 1) % 3;
    saveState();
    renderSheetContent(item);
    renderActiveTabList();
  }

  function bumpCounter(id, field, delta){
    const item = findItem(id);
    if(!item) return;
    item[field] = Math.max(0, (item[field]||0) + delta);
    if(field === "readCount" && item.ownedCount < item.readCount) item.ownedCount = item.readCount;
    saveState();
    renderSheetContent(item);
    renderActiveTabList();
  }

  function dismissNewChapters(id){
    const item = findItem(id);
    if(!item) return;
    item.chaptersKnown = item.totalChapters || item.chaptersKnown;
    item.newChaptersCount = 0;
    saveState();
    render();
  }

  async function refreshAll(){
    if(!state.items.length){ toast("No hay nada que actualizar todavía"); return; }
    toast("Actualizando desde AniList…");
    let updated = 0, newChapters = 0, failed = 0;
    for(const item of state.items){
      try{
        const media = await fetchMediaById(item.id);
        if(!media) continue;
        item.status = media.status;
        item.totalVolumes = media.volumes || item.totalVolumes;
        const prevKnownTotal = item.totalChapters || 0;
        item.totalChapters = media.chapters || item.totalChapters;
        item.startDate = (media.startDate && media.startDate.year) ? media.startDate : item.startDate;
        if(item.totalChapters && item.totalChapters > (item.chaptersKnown||0)){
          item.newChaptersCount = item.totalChapters - (item.chaptersKnown||0);
          if(item.totalChapters > prevKnownTotal) newChapters++;
        }
        updated++;
      }catch(e){ failed++; }
    }
    saveState();
    render();
    if(failed && !updated){
      toast("No se pudo conectar con AniList. Revisa tu conexión.");
    }else{
      toast(`Actualizado (${updated}) · ${newChapters} con capítulos nuevos${failed?` · ${failed} fallidos`:""}`);
    }
  }

  /* ---------------- Export / Import ---------------- */
  function exportData(){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "tomo-backup.json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  function importData(file){
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.items)) throw new Error("formato inválido");
        state = parsed;
        saveState();
        render();
        toast("Copia importada correctamente");
      }catch(e){
        toast("El archivo no es una copia válida");
      }
    };
    reader.onerror = () => toast("No se pudo leer el archivo");
    reader.readAsText(file);
  }

  /* ---------------- Render: shell ---------------- */
  function renderStats(){
    const lib = state.items.filter(i=>i.inLibrary);
    const wish = state.items.filter(i=>i.inWishlist);
    const newChaps = lib.filter(i=>i.newChaptersCount>0).length;
    const row = document.getElementById("statsRow");
    row.innerHTML = `
      <div class="stat-chip"><b>${lib.length}</b>en biblioteca</div>
      <div class="stat-chip"><b>${wish.length}</b>en wishlist</div>
      <div class="stat-chip"><b>${newChaps}</b>con capítulos nuevos</div>
    `;
    document.getElementById("upcomingDot").style.display =
      (newChaps>0 || lib.some(i=>i.status==="NOT_YET_RELEASED")) ? "block" : "none";
  }

  function posterHTML(item){
    const color = itemColor(item);
    const dark = itemColorDark(item);
    const initials = item.title.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
    const cover = item.cover
      ? `<img src="${item.cover}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : "";
    const placeholder = `<div class="poster-placeholder" style="background:linear-gradient(160deg, ${color}, ${dark})">${initials}</div>`;
    const pct = item.totalVolumes
      ? Math.round(((item.volumeStates ? item.volumeStates.filter(s=>s===2).length : item.readCount) / item.totalVolumes) * 100)
      : null;
    return `
      <div class="poster" data-open="${item.id}" style="box-shadow:0 6px 22px -8px ${color}66;">
        <div class="poster-glow" style="border-color:${color}55;"></div>
        ${placeholder}
        ${cover}
        ${item.newChaptersCount>0 ? `<span class="poster-newchip">+${item.newChaptersCount}</span>` : ""}
        <div class="poster-scrim">
          <span class="poster-tag" style="background:${color};">${statusLabel(item.status)}</span>
          <p class="poster-title">${item.title}</p>
          ${pct!==null ? `<div class="poster-progress"><div class="poster-progress-fill" style="width:${pct}%; background:${color};"></div></div>` : ""}
        </div>
      </div>`;
  }

  function renderLibrary(){
    const items = state.items.filter(i=>i.inLibrary);
    if(!items.length) return `<div class="empty"><b>Tu estantería está vacía</b>Busca un manga y añádelo a tu biblioteca para empezar a llevar el control de tomos y lectura.</div>`;
    return `<p class="section-label">Mi biblioteca <span class="count">${items.length}</span></p>
      <div class="grid">${items.sort((a,b)=>a.title.localeCompare(b.title)).map(posterHTML).join("")}</div>`;
  }

  function renderWishlist(){
    const items = state.items.filter(i=>i.inWishlist);
    if(!items.length) return `<div class="empty"><b>Ninguna serie en espera</b>Añade aquí los manga que quieres pillar pero todavía no tienes.</div>`;
    return `<p class="section-label">Wishlist <span class="count">${items.length}</span></p>
      <div class="grid">${items.sort((a,b)=>a.title.localeCompare(b.title)).map(posterHTML).join("")}</div>`;
  }

  function upThumb(item){
    const color = itemColor(item);
    const dark = itemColorDark(item);
    const initials = item.title.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
    return item.cover
      ? `<img src="${item.cover}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'up-placeholder',style:'background:linear-gradient(160deg, ${color}, ${dark})',textContent:'${initials}'}))">`
      : `<div class="up-placeholder" style="background:linear-gradient(160deg, ${color}, ${dark})">${initials}</div>`;
  }

  function renderUpcoming(){
    const tracked = state.items.filter(i=>i.inLibrary || i.inWishlist);
    const notYet = tracked.filter(i=>i.status==="NOT_YET_RELEASED");
    const withNew = tracked.filter(i=>i.newChaptersCount>0);

    let html = `<p class="section-label">Próximos lanzamientos</p>`;
    html += `<p class="section-sub">AniList no da fechas exactas de tomo físico para series en curso — aquí verás series anunciadas sin publicar, capítulos ya salidos que aún no has leído, y puedes anotar tú la fecha de un próximo tomo físico.</p>`;

    if(!tracked.length){
      return html + `<div class="empty"><b>Nada que mostrar todavía</b>Añade series a tu biblioteca o wishlist para ver aquí sus novedades.</div>`;
    }

    if(notYet.length){
      html += notYet.map(i => `
        <div class="up-item">
          ${upThumb(i)}
          <div style="flex:1">
            <div class="up-date" style="color:${itemColor(i)}">${fmtDate(i.startDate) || "Fecha por confirmar"}<small>Aún no publicado</small></div>
            <p class="up-title">${i.title}</p>
          </div>
        </div>`).join("");
    }
    if(withNew.length){
      html += withNew.map(i => `
        <div class="up-item">
          ${upThumb(i)}
          <div style="flex:1">
            <div class="up-date" style="color:var(--danger)">+${i.newChaptersCount}<small>capítulos nuevos</small></div>
            <p class="up-title">${i.title}</p>
            <button class="mini-btn" data-action="dismiss-chap" data-id="${i.id}">Marcar como visto</button>
          </div>
        </div>`).join("");
    }

    html += `<p class="section-label" style="font-size:17px;margin-top:22px;">Fechas anotadas por ti</p>`;
    html += tracked.map(i => `
      <div class="up-item">
        ${upThumb(i)}
        <div style="flex:1">
          <p class="up-title" style="margin-top:0">${i.title}</p>
          <input type="date" class="date-input" style="margin-bottom:6px" value="${i.manualNextDate||""}" data-action="set-date" data-id="${i.id}">
          <input type="text" class="note-input" placeholder="Nota (ej: tomo 12, preventa Amazon…)" value="${i.manualNote||""}" data-action="set-note" data-id="${i.id}">
        </div>
      </div>`).join("");

    return html;
  }

  let searchResultsCache = [];
  function renderSearch(){
    return `
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar manga por título…" autocomplete="off">
        <button id="searchGo">IR</button>
      </div>
      <div id="searchResults"></div>
    `;
  }

  function resultCardHTML(media){
    const item = findItem(media.id);
    const inLib = item && item.inLibrary;
    const inWish = item && item.inWishlist;
    const fakeItem = item || { title: bestTitle(media.title), id: media.id };
    const color = itemColor(fakeItem);
    const dark = itemColorDark(fakeItem);
    const initials = bestTitle(media.title).split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
    const cover = media.coverImage && media.coverImage.medium
      ? `<img src="${media.coverImage.medium}" alt="" onerror="this.style.display='none'">`
      : "";
    return `
      <div class="result-card">
        <div style="position:relative; width:52px; height:74px; flex-shrink:0;">
          <div class="result-placeholder" style="background:linear-gradient(160deg, ${color}, ${dark}); position:absolute; inset:0;">${initials}</div>
          <div style="position:absolute; inset:0;">${cover}</div>
        </div>
        <div class="result-info">
          <p class="result-title">${bestTitle(media.title)}</p>
          <span class="tag" style="border-color:${color}; color:${color};">${statusLabel(media.status)}</span>
          <div class="result-actions">
            <button class="mini-btn ${inLib?'added':'solid'}" data-action="add-lib" data-id="${media.id}">${inLib?'En biblioteca ✓':'Tengo'}</button>
            <button class="mini-btn ${inWish?'added':''}" data-action="add-wish" data-id="${media.id}">${inWish?'En wishlist ✓':'Quiero'}</button>
          </div>
        </div>
      </div>`;
  }

  function renderActiveTabList(){
    // re-render just the current tab's list (used after modal edits, keeps sheet open)
    const main = document.getElementById("main");
    if(activeTab==="library") main.innerHTML = renderLibrary();
    else if(activeTab==="wishlist") main.innerHTML = renderWishlist();
    else if(activeTab==="upcoming") main.innerHTML = renderUpcoming();
  }

  function render(){
    const main = document.getElementById("main");
    if(activeTab==="library") main.innerHTML = renderLibrary();
    else if(activeTab==="wishlist") main.innerHTML = renderWishlist();
    else if(activeTab==="upcoming") main.innerHTML = renderUpcoming();
    else if(activeTab==="search"){
      main.innerHTML = renderSearch();
      const resultsEl = document.getElementById("searchResults");
      if(searchResultsCache.length){
        resultsEl.innerHTML = searchResultsCache.map(resultCardHTML).join("");
      }
      document.getElementById("searchGo").addEventListener("click", doSearch);
      document.getElementById("searchInput").addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(); });
    }
    renderStats();
  }

  async function doSearch(){
    const input = document.getElementById("searchInput");
    const term = input.value.trim();
    if(!term) return;
    const resultsEl = document.getElementById("searchResults");
    resultsEl.innerHTML = `<div class="loading">Buscando en AniList…</div>`;
    try{
      const media = await searchManga(term);
      searchResultsCache = media;
      resultsEl.innerHTML = media.length
        ? media.map(resultCardHTML).join("")
        : `<div class="empty"><b>Sin resultados</b>Prueba con otro título o en su idioma original.</div>`;
    }catch(e){
      resultsEl.innerHTML = `<div class="empty"><b>No se pudo conectar con AniList</b>Comprueba tu conexión e inténtalo de nuevo.</div>`;
    }
  }

  /* ---------------- Bottom sheet ---------------- */
  function volumeBlock(item){
    const color = itemColor(item);
    if(item.volumeStates){
      const squares = item.volumeStates.map((s,idx)=>{
        const cls = s===0?"":(s===1?"owned":"read");
        const style = s===2 ? `style="background:${color};"` : "";
        return `<div class="vol-sq ${cls}" ${style} data-action="cycle" data-id="${item.id}" data-idx="${idx}">${idx+1}</div>`;
      }).join("");
      const read = item.volumeStates.filter(s=>s===2).length;
      return `
        <p class="vol-hint">Toca un tomo para marcarlo: vacío → comprado → leído · ${read}/${item.volumeStates.length} leídos</p>
        <div class="vol-grid">${squares}</div>`;
    }
    return `
      <div class="counter-row">
        <div class="counter">
          <label>Tomos comprados</label>
          <div class="counter-controls">
            <button data-action="dec" data-field="ownedCount" data-id="${item.id}">−</button>
            <span>${item.ownedCount||0}</span>
            <button data-action="inc" data-field="ownedCount" data-id="${item.id}">+</button>
          </div>
        </div>
        <div class="counter">
          <label>Tomos leídos</label>
          <div class="counter-controls">
            <button data-action="dec" data-field="readCount" data-id="${item.id}">−</button>
            <span>${item.readCount||0}</span>
            <button data-action="inc" data-field="readCount" data-id="${item.id}">+</button>
          </div>
        </div>
      </div>`;
  }

  function renderSheetContent(item){
    const content = document.getElementById("sheetContent");
    const color = itemColor(item);
    const dark = itemColorDark(item);
    const initials = item.title.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
    const cover = item.cover
      ? `<img class="sheet-cover" src="${item.cover}" alt="" onerror="this.style.display='none'">`
      : "";
    content.innerHTML = `
      <button class="sheet-close" data-action="close-sheet" aria-label="Cerrar">✕</button>
      <div class="sheet-head">
        <div style="position:relative; width:88px; height:126px; flex-shrink:0; border-radius:10px; overflow:hidden;">
          <div style="position:absolute; inset:0; background:linear-gradient(160deg, ${color}, ${dark}); display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue'; font-size:17px; color:#fff;">${initials}</div>
          ${cover}
        </div>
        <div style="flex:1; min-width:0;">
          <p class="sheet-title">${item.title}</p>
          <div class="tag-row">
            <span class="tag" style="border-color:${color}; color:${color};">${statusLabel(item.status)}</span>
            ${item.totalVolumes ? `<span class="tag">${item.totalVolumes} tomos</span>` : ""}
            ${!item.totalVolumes && item.totalChapters ? `<span class="tag">${item.totalChapters} caps.</span>` : ""}
          </div>
          ${item.newChaptersCount>0 ? `<button class="newchap" data-action="dismiss-chap" data-id="${item.id}">+${item.newChaptersCount} caps. nuevos · marcar visto</button>` : ""}
        </div>
      </div>
      ${item.inLibrary ? volumeBlock(item) : `<p class="section-sub" style="margin-top:0;">Está en tu wishlist. Cuando la tengas, muévela a biblioteca para llevar el control de tomos.</p>`}
      <span class="field-label">Próximo tomo (fecha que anotes tú)</span>
      <input type="date" class="date-input" value="${item.manualNextDate||""}" data-action="set-date" data-id="${item.id}">
      <input type="text" class="note-input" placeholder="Nota (ej: preventa, nº de tomo…)" value="${item.manualNote||""}" data-action="set-note" data-id="${item.id}">
      <div class="sheet-actions">
        ${item.inWishlist ? `<button class="primary" data-action="move-lib" data-id="${item.id}">Ya lo tengo</button>` : ""}
        <button class="danger" data-action="remove" data-id="${item.id}">Eliminar</button>
      </div>
    `;
  }

  function openSheet(id){
    const item = findItem(id);
    if(!item) return;
    openItemId = id;
    renderSheetContent(item);
    document.getElementById("sheet").classList.add("open");
    document.getElementById("sheetBackdrop").classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeSheet(){
    openItemId = null;
    document.getElementById("sheet").classList.remove("open");
    document.getElementById("sheetBackdrop").classList.remove("open");
    document.body.style.overflow = "";
  }

  /* ---------------- Event delegation ---------------- */
  document.addEventListener("click", (e)=>{
    const poster = e.target.closest("[data-open]");
    if(poster){ openSheet(Number(poster.dataset.open)); return; }

    const t = e.target.closest("[data-action]");
    if(!t) return;
    const action = t.dataset.action;
    const id = t.dataset.id ? Number(t.dataset.id) : null;

    if(action==="cycle") cycleVolume(id, Number(t.dataset.idx));
    else if(action==="inc") bumpCounter(id, t.dataset.field, 1);
    else if(action==="dec") bumpCounter(id, t.dataset.field, -1);
    else if(action==="dismiss-chap"){ dismissNewChapters(id); if(openItemId===id) closeSheet(); }
    else if(action==="remove") removeItem(id);
    else if(action==="move-lib") moveToLibrary(id);
    else if(action==="close-sheet") closeSheet();
    else if(action==="add-lib"){
      const media = searchResultsCache.find(m=>m.id===id);
      if(media) addToLibrary(media);
    }
    else if(action==="add-wish"){
      const media = searchResultsCache.find(m=>m.id===id);
      if(media) addToWishlist(media);
    }
  });

  document.getElementById("sheetBackdrop").addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeSheet(); });

  document.addEventListener("change", (e)=>{
    const t = e.target;
    if(t.dataset && t.dataset.action==="set-date"){
      const item = findItem(Number(t.dataset.id));
      if(item){ item.manualNextDate = t.value; saveState(); if(activeTab==="upcoming") renderActiveTabList(); }
    }
  });
  document.addEventListener("input", (e)=>{
    const t = e.target;
    if(t.dataset && t.dataset.action==="set-note"){
      const item = findItem(Number(t.dataset.id));
      if(item){ item.manualNote = t.value; saveState(); }
    }
  });

  document.querySelectorAll(".tab, .bottomnav button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      activeTab = btn.dataset.tab;
      document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b.dataset.tab===activeTab));
      document.querySelectorAll(".bottomnav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===activeTab));
      render();
      window.scrollTo(0,0);
    });
  });

  document.getElementById("refreshBtn").addEventListener("click", refreshAll);
  document.getElementById("exportBtn").addEventListener("click", exportData);
  document.getElementById("importBtn").addEventListener("click", ()=>document.getElementById("fileImport").click());
  document.getElementById("fileImport").addEventListener("change", (e)=>{
    if(e.target.files[0]) importData(e.target.files[0]);
    e.target.value = "";
  });

  render();
})();
</script>
</body>
</html>
