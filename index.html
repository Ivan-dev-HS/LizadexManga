<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>
  try{
    var t = localStorage.getItem("tomo_theme");
    document.documentElement.setAttribute("data-theme", (t==="dark"||t==="light") ? t : "light");
  }catch(e){ document.documentElement.setAttribute("data-theme","light"); }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FAF7F2" id="themeColorMeta">
<title>Tomo — Mi Manga</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"]{
    --bg:#0B0B0F;
    --bg-rgb:11,11,15;
    --surface:#17171D;
    --surface-2:#1F1F27;
    --text:#F5F3EE;
    --text-soft:#9C9AA5;
    --line:#2A2A33;
    --danger:#FF5470;
    --green:#4ADE9C;
    --blob-a: rgba(74,222,156,.32);
    --blob-b: rgba(255,84,112,.3);
    --blob-c: rgba(124,140,255,.2);
  }
  [data-theme="light"]{
    --bg:#FAF7F2;
    --bg-rgb:250,247,242;
    --surface:#FFFFFF;
    --surface-2:#F1EEE6;
    --text:#1A1A1F;
    --text-soft:#726F79;
    --line:#E6E1D6;
    --danger:#E0294A;
    --green:#0A9D63;
    --blob-a: rgba(14,157,104,.22);
    --blob-b: rgba(224,41,74,.2);
    --blob-c: rgba(90,110,240,.17);
  }
  html{background:var(--bg);}
  body, .banner, .sheet, .btn-icon, .poster, .stat-chip{ transition:background-color .25s, border-color .25s, color .25s; }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--text);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:150px;
  }
  ::selection{background:var(--green); color:var(--bg);}
  :focus-visible{outline:2px solid var(--green); outline-offset:2px;}
  img{max-width:100%;}

  /* ---------- Header ---------- */
  .banner{
    position:relative;
    padding:20px 16px 16px;
    background:
      radial-gradient(120% 140% at 15% -10%, var(--blob-a), transparent 55%),
      radial-gradient(120% 140% at 100% 0%, var(--blob-b), transparent 55%),
      radial-gradient(90% 120% at 60% 120%, var(--blob-c), transparent 60%),
      var(--bg);
    background-size:140% 140%, 140% 140%, 140% 140%, 100% 100%;
    animation:bannerDrift 14s ease-in-out infinite;
  }
  @keyframes bannerDrift{
    0%,100%{ background-position:0% 0%, 100% 0%, 50% 100%, 0 0; }
    50%{ background-position:10% 15%, 90% 10%, 60% 90%, 0 0; }
  }
  .banner-inner{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .brand{font-family:'Bebas Neue', sans-serif; font-size:38px; letter-spacing:1px; line-height:1;}
  .brand small{
    display:block; font-family:'JetBrains Mono', monospace; font-size:9.5px;
    letter-spacing:3px; color:var(--text-soft); text-transform:uppercase; margin-top:3px;
  }
  .header-actions{display:flex; gap:8px;}
  .btn-icon{
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:999px; width:40px; height:40px; font-size:17px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .btn-icon:active{transform:scale(.94);}
  .btn-icon svg{display:block;}
  .stats-row{display:flex; gap:8px; margin-top:16px; overflow-x:auto; padding-bottom:2px;}
  .stat-chip{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; white-space:nowrap;
    background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:7px 12px;
    color:var(--text-soft);
  }
  .stat-chip b{color:var(--text); font-size:13px; margin-right:4px;}

  main{padding:16px 14px 8px; max-width:640px; margin:0 auto;}
  main.fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .section-label{
    font-family:'Bebas Neue', sans-serif; font-size:24px; letter-spacing:.4px;
    margin:4px 2px 14px; display:flex; align-items:center; gap:8px;
  }
  .section-label .count{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-soft);
    border:1px solid var(--line); border-radius:20px; padding:2px 9px;
  }
  .section-sub{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--text-soft);
    margin:-8px 2px 16px; line-height:1.5;
  }

  .spine-strip{
    display:flex; align-items:flex-end; gap:2px; height:46px; padding:8px 10px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:16px;
    overflow-x:auto;
  }
  .spine-strip .spine{
    width:5px; min-width:5px; border-radius:2px 2px 0 0; opacity:.9;
  }
  .spine-strip-label{
    font-family:'JetBrains Mono'; font-size:9px; color:var(--text-soft); text-transform:uppercase;
    letter-spacing:.3px; margin:-10px 2px 14px;
  }

  .view-toggle{display:flex; gap:6px; margin-bottom:14px;}
  .view-toggle button{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
    color:var(--text-soft); font-family:'JetBrains Mono'; font-size:10px; text-transform:uppercase; cursor:pointer;
  }
  .view-toggle button.active{background:var(--text); color:var(--bg); border-color:var(--text); font-weight:700;}

  .shelf-view{display:flex; flex-direction:column;}
  .shelf-row{
    display:flex; align-items:flex-end; flex-wrap:wrap; gap:3px;
    padding:12px 6px 0;
  }
  .spine-book{
    position:relative; flex-shrink:0; border-radius:3px 3px 1px 1px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    box-shadow:inset 2px 0 0 rgba(255,255,255,.22), inset -2px 0 0 rgba(0,0,0,.22), 0 3px 6px -2px rgba(0,0,0,.35);
    transition:transform .15s;
  }
  .spine-book:active{transform:scale(.95) translateY(2px);}
  .spine-book-title{
    flex:1; display:flex; align-items:center; justify-content:center; padding:8px 0 4px;
    writing-mode:vertical-rl; text-orientation:mixed;
    font-family:'Zen Kaku Gothic New'; font-weight:700; font-size:9.5px; color:rgba(255,255,255,.95);
    text-shadow:0 1px 2px rgba(0,0,0,.35); white-space:nowrap; overflow:hidden; max-height:100%;
  }
  .spine-book-vol{
    font-family:'JetBrains Mono'; font-size:8px; color:rgba(255,255,255,.95);
    background:rgba(0,0,0,.28); border-radius:3px; padding:1px 5px; margin-bottom:5px;
  }
  .spine-book-edition{
    position:absolute; top:3px; left:0; right:0; text-align:center;
    font-family:'JetBrains Mono'; font-size:6.5px; letter-spacing:.3px; color:rgba(255,255,255,.85);
    text-transform:uppercase;
  }
  .shelf-board{
    height:15px; margin:0 2px 18px; border-radius:0 0 5px 5px;
    background:linear-gradient(180deg, #A9713F, #6B4423);
    box-shadow:0 5px 8px -2px rgba(0,0,0,.4);
  }
  .shelf-hint{
    font-family:'JetBrains Mono'; font-size:9.5px; color:var(--text-soft); text-align:center; margin:2px 0 14px;
  }

  .empty{
    text-align:center; padding:56px 22px; color:var(--text-soft);
    border:1.5px dashed var(--line); border-radius:16px;
  }
  .empty b{display:block; color:var(--text); font-family:'Bebas Neue'; font-size:22px; margin-bottom:6px;}
  .empty svg{color:var(--line); margin-bottom:10px;}

  /* ---------- Poster grid ---------- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .poster{
    position:relative; border-radius:16px; overflow:hidden; cursor:pointer;
    aspect-ratio:2/3; background:var(--surface);
    border:1px solid var(--line);
    transition:transform .2s;
    opacity:0; animation:popIn .45s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay:calc(var(--i, 0) * 45ms);
  }
  @keyframes popIn{
    from{ opacity:0; transform:scale(.9) translateY(10px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
  }
  .poster:active{transform:scale(.96);}
  .poster img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .35s ease;}
  .poster img.loaded{opacity:1;}
  .poster-placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:15px; text-align:center; padding:14px; line-height:1.15; color:#fff;
  }
  .poster-scrim{
    position:absolute; left:0; right:0; bottom:0; padding:10px 10px 9px;
    background:linear-gradient(to top, rgba(0,0,0,.92) 10%, rgba(0,0,0,.55) 55%, transparent 100%);
  }
  .poster-title{
    font-weight:700; font-size:12.5px; line-height:1.2; margin:0 0 6px; color:#fff;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .poster-tag{
    display:inline-block; font-family:'JetBrains Mono'; font-size:8.5px; text-transform:uppercase;
    letter-spacing:.3px; padding:2px 6px; border-radius:5px; color:#0B0B0F; font-weight:700; margin-bottom:6px;
  }
  .poster-progress{height:4px; border-radius:3px; background:rgba(255,255,255,.22); overflow:hidden;}
  .poster-progress-fill{height:100%; transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .poster-newchip{
    position:absolute; top:8px; right:8px; background:var(--danger); color:#fff;
    font-family:'JetBrains Mono'; font-size:9px; font-weight:700; padding:3px 7px; border-radius:20px;
    animation:chipPulse 2.4s ease-in-out infinite;
  }
  @keyframes chipPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,84,112,.55); }
    50%{ box-shadow:0 0 0 5px rgba(255,84,112,0); }
  }
  .poster-glow{position:absolute; inset:-1px; border-radius:16px; border:2px solid transparent; pointer-events:none;}
  .poster-custom-badge{
    position:absolute; top:8px; left:8px; background:rgba(0,0,0,.55); color:#fff;
    font-family:'JetBrains Mono'; font-size:8px; padding:2px 6px; border-radius:5px; letter-spacing:.3px;
  }

  /* ---------- Bottom sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:51; max-height:88vh;
    background:var(--surface); border-radius:22px 22px 0 0; border-top:1px solid var(--line);
    transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:10px auto 4px;}
  .sheet-scroll{overflow-y:auto; padding:14px 18px 24px;}
  .sheet-head{display:flex; gap:14px; margin-bottom:14px;}
  .sheet-title{font-weight:700; font-size:16px; line-height:1.25; margin:0 0 8px;}
  .sheet-close{
    position:absolute; top:12px; right:14px; background:var(--surface-2); border:1px solid var(--line);
    color:var(--text); width:32px; height:32px; border-radius:50%; font-size:15px; cursor:pointer;
  }
  .sheet-heading{font-family:'Bebas Neue'; font-size:22px; margin:2px 0 14px; padding-right:38px;}

  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .tag{
    font-family:'JetBrains Mono'; font-size:9.5px; text-transform:uppercase; letter-spacing:.3px;
    padding:3px 8px; border-radius:20px; border:1px solid var(--line); color:var(--text-soft);
  }
  .newchap{
    display:inline-flex; align-items:center; gap:6px; background:var(--danger); color:#fff;
    font-family:'JetBrains Mono'; font-size:10.5px; font-weight:700; padding:5px 10px;
    border-radius:20px; margin-bottom:8px; border:none; cursor:pointer;
  }

  .vol-hint{font-family:'JetBrains Mono'; font-size:9.5px; color:var(--text-soft); margin:0 0 8px;}
  .vol-grid{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:16px;}
  .vol-sq{
    width:30px; height:34px; border:1.5px solid var(--line); border-radius:6px;
    font-family:'JetBrains Mono'; font-size:9.5px; display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); color:var(--text-soft); cursor:pointer; user-select:none;
    transition:transform .12s;
  }
  .vol-sq:active{transform:scale(.88);}
  .vol-sq.owned{background:var(--surface-2); color:var(--text); font-weight:700; border-color:var(--text-soft);}
  .vol-sq.read{color:#0B0B0F; font-weight:700; border-color:transparent;}

  .counter-row{display:flex; gap:10px; margin-bottom:16px;}
  .counter{flex:1; border:1px solid var(--line); border-radius:12px; padding:8px 10px;}
  .counter label{display:block; font-family:'JetBrains Mono'; font-size:9px; color:var(--text-soft); text-transform:uppercase; margin-bottom:6px;}
  .counter-controls{display:flex; align-items:center; justify-content:space-between;}
  .counter-controls button{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text); font-size:16px; line-height:1; cursor:pointer;
    transition:transform .15s;
  }
  .counter-controls button:active{transform:scale(.9);}
  .counter-controls span{font-family:'JetBrains Mono'; font-weight:700;}

  .field-label{font-family:'JetBrains Mono'; font-size:9.5px; text-transform:uppercase; color:var(--text-soft); margin:14px 0 6px; display:block;}
  .field-hint{font-family:'JetBrains Mono'; font-size:9.5px; color:var(--text-soft); margin:6px 2px 0; line-height:1.5;}
  .date-input, .note-input, .text-input, .number-input, .select-input{
    width:100%; font-family:'Zen Kaku Gothic New'; font-size:13px; padding:9px 11px;
    border:1px solid var(--line); border-radius:10px; background:var(--surface-2); color:var(--text);
  }
  .date-input, .number-input{font-family:'JetBrains Mono';}

  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .sheet-actions button{
    flex:1; padding:12px; border-radius:12px; border:1px solid var(--line);
    font-family:'JetBrains Mono'; font-size:11px; text-transform:uppercase; letter-spacing:.3px;
    background:var(--surface-2); color:var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .sheet-actions button svg{flex-shrink:0;}
  .sheet-actions button.primary{background:var(--green); color:#0B0B0F; border-color:var(--green); font-weight:700;}
  .sheet-actions button.danger{color:var(--danger); border-color:var(--danger);}

  .cover-picker{
    display:flex; align-items:center; gap:12px; margin-bottom:4px;
  }
  .cover-preview{
    width:64px; height:92px; border-radius:8px; object-fit:cover; background:var(--surface-2);
    border:1px solid var(--line);
  }
  .cover-picker label.upload-btn{
    font-family:'JetBrains Mono'; font-size:10px; text-transform:uppercase; padding:8px 12px;
    border:1px solid var(--line); border-radius:10px; background:var(--surface-2); cursor:pointer; color:var(--text);
  }

  .camera-wrap{
    position:relative; width:100%; aspect-ratio:4/3; border-radius:14px; overflow:hidden;
    background:#000; margin:10px 0 6px;
  }
  .camera-wrap video{width:100%; height:100%; object-fit:cover; display:block;}
  .scan-guide{
    position:absolute; inset:22% 8%; border:2.5px solid var(--green); border-radius:12px;
    box-shadow:0 0 0 999px rgba(0,0,0,.45);
  }
  .camera-hint{
    font-family:'JetBrains Mono'; font-size:10px; color:var(--text-soft); text-align:center; margin:0 0 10px;
  }
  .scan-result{
    border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; background:var(--surface-2);
  }
  .scan-result b{font-family:'Bebas Neue'; font-size:17px; display:block; margin-bottom:4px;}
  .confidence{font-family:'JetBrains Mono'; font-size:9.5px; text-transform:uppercase;}
  .confidence.high{color:var(--green);} .confidence.medium{color:#E0C25A;} .confidence.low{color:var(--danger);}
  .match-option{
    display:flex; gap:10px; align-items:center; padding:9px; border:1px solid var(--line); border-radius:10px;
    margin-top:8px; cursor:pointer;
  }
  .match-option img{width:38px; height:54px; object-fit:cover; border-radius:5px; flex-shrink:0;}
  .match-option.selected{border-color:var(--green); background:rgba(74,222,156,.08);}

  /* ---------- Upcoming ---------- */
  .up-item{
    display:flex; gap:12px; padding:12px; background:var(--surface);
    border:1px solid var(--line); border-radius:14px; margin-bottom:10px;
  }
  .up-item img{width:52px; height:74px; object-fit:cover; border-radius:8px;}
  .up-placeholder{
    width:52px; height:74px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:13px; color:#fff; flex-shrink:0;
  }
  .up-date{font-family:'Bebas Neue'; font-size:20px; line-height:1;}
  .up-date small{display:block; font-family:'JetBrains Mono'; font-size:8.5px; color:var(--text-soft); text-transform:uppercase; margin-top:3px;}
  .up-title{font-weight:700; font-size:13px; margin:4px 0 6px; color:var(--text);}

  /* ---------- Search ---------- */
  .search-bar{display:flex; gap:8px; margin-bottom:12px;}
  .search-bar input{
    flex:1; padding:13px 15px; border:1px solid var(--line); border-radius:12px;
    font-family:'Zen Kaku Gothic New'; font-size:14px; background:var(--surface); color:var(--text);
  }
  .search-bar input::placeholder{color:var(--text-soft);}
  .search-bar button{
    background:var(--green); color:#0B0B0F; border:none; border-radius:12px; padding:0 20px;
    font-family:'Bebas Neue'; font-size:16px; letter-spacing:.5px; cursor:pointer;
  }
  .fab{
    position:fixed; right:18px; bottom:calc(78px + env(safe-area-inset-bottom)); z-index:29;
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background:var(--green); color:#0B0B0F;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px -6px rgba(0,0,0,.4), 0 0 0 5px rgba(var(--bg-rgb),.85);
    transition:transform .18s;
  }
  .fab:active{transform:scale(.92);}
  .fab-choice{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:14px 6px; border:none; border-bottom:1px solid var(--line); background:transparent;
    color:var(--text); font-family:'Zen Kaku Gothic New'; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .fab-choice:last-child{border-bottom:none;}
  .fab-choice .fab-choice-ic{
    width:38px; height:38px; border-radius:11px; background:var(--surface-2); color:var(--green);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .fab-choice-sub{display:block; font-family:'JetBrains Mono'; font-size:10px; font-weight:400; color:var(--text-soft); margin-top:2px; text-transform:none;}
  .ic{display:inline-flex; align-items:center; justify-content:center;}
  .result-card{
    display:flex; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:10px; margin-bottom:10px; align-items:center;
  }
  .result-card img{width:52px; height:74px; object-fit:cover; border-radius:8px; flex-shrink:0;}
  .result-placeholder{
    width:52px; height:74px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:13px; color:#fff; flex-shrink:0; text-align:center;
  }
  .result-info{flex:1; min-width:0;}
  .result-title{font-weight:700; font-size:13px; margin:0 0 6px; line-height:1.25; color:var(--text);}
  .result-actions{display:flex; gap:6px; margin-top:8px;}
  .mini-btn{
    font-family:'JetBrains Mono'; font-size:9.5px; text-transform:uppercase; padding:6px 10px;
    border-radius:20px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; color:var(--text);
    transition:transform .15s;
  }
  .mini-btn:active{transform:scale(.93);}
  .mini-btn.solid{background:var(--text); color:var(--bg); border-color:var(--text); font-weight:700;}
  .mini-btn.added{background:var(--green); border-color:var(--green); color:#0B0B0F; font-weight:700;}

  .loading{text-align:center; padding:36px; font-family:'JetBrains Mono'; font-size:12px; color:var(--text-soft);}
  .spinner{
    width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--green); border-radius:50%;
    margin:0 auto 10px; animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:rgba(var(--bg-rgb), .88); backdrop-filter:blur(10px);
    display:flex; justify-content:space-around;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .bottomnav button{
    background:transparent; border:none; color:var(--text-soft);
    font-family:'JetBrains Mono'; font-size:9.5px; text-transform:uppercase;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer; padding:4px 10px; position:relative; transition:color .2s;
  }
  .bottomnav button.active{color:var(--text);}
  .bottomnav button.active .ic{animation:navPop .3s cubic-bezier(.3,1.5,.4,1);}
  @keyframes navPop{ 0%{transform:scale(1);} 45%{transform:scale(1.28);} 100%{transform:scale(1);} }
  .bottomnav .nav-dot{
    position:absolute; top:0; right:2px; width:6px; height:6px; border-radius:50%; background:var(--danger);
  }

  .menu-item{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:13px 4px; border:none; border-bottom:1px solid var(--line); background:transparent;
    color:var(--text); font-family:'Zen Kaku Gothic New'; font-size:14px; cursor:pointer;
    transition:opacity .15s;
  }
  .menu-item:active{opacity:.6;}
  .menu-item:last-child{border-bottom:none;}
  .menu-item svg{color:var(--text-soft); flex-shrink:0;}
  .menu-item.danger{color:var(--danger);}
  .menu-item.danger svg{color:var(--danger);}
  .app-version{font-family:'JetBrains Mono'; font-size:9.5px; color:var(--text-soft); text-align:center; padding:14px 0 2px;}

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:var(--text); color:var(--bg); padding:10px 18px; border-radius:20px;
    font-family:'JetBrains Mono'; font-size:12px; font-weight:700; z-index:99; opacity:0; pointer-events:none;
    transition:opacity .25s, bottom .25s; max-width:86%; text-align:center;
  }
  .toast.show{opacity:1; bottom:114px;}

  #fileImport, #manualCoverInput{display:none;}
</style>
</head>
<body>

  <div class="banner">
    <div class="banner-inner">
      <div class="brand">TOMO<small>seguimiento de manga</small></div>
      <div class="header-actions">
        <button class="btn-icon" id="refreshBtn" title="Actualizar desde AniList" aria-label="Actualizar"></button>
        <button class="btn-icon" id="menuBtn" title="Más opciones" aria-label="Más opciones"></button>
      </div>
    </div>
    <div class="stats-row" id="statsRow"></div>
  </div>

  <main id="main"></main>

  <button class="fab" id="fabBtn" aria-label="Añadir manga"></button>

  <div class="bottomnav">
    <button class="active" data-tab="library"></button>
    <button data-tab="wishlist"></button>
    <button data-tab="upcoming"></button>
    <button data-tab="search"></button>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div class="sheet-scroll" id="sheetContent"></div>
  </div>

  <input type="file" id="fileImport" accept=".json">
  <input type="file" id="manualCoverInput" accept="image/*">

  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const STORE_KEY = "tomo_manga_data_v3";
  const ANILIST_URL = "https://graphql.anilist.co";

  /* ---------------- Iconos (set propio, coherente en todos los dispositivos) ---------------- */
  const ICON_PATHS = {
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>',
    star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>',
    search: '<circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>',
    refresh: '<path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>',
    close: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
    pencil: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>',
    barcode: '<line x1="3" y1="5" x2="3" y2="19"></line><line x1="7" y1="5" x2="7" y2="19"></line><line x1="10" y1="5" x2="10" y2="19"></line><line x1="14" y1="5" x2="14" y2="19"></line><line x1="17" y1="5" x2="17" y2="19"></line><line x1="21" y1="5" x2="21" y2="19"></line>',
    more: '<circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle>',
    download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>',
    upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>',
    info: '<circle cx="12" cy="12" r="9"></circle><line x1="12" y1="16" x2="12" y2="11"></line><circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"></circle>',
    camera: '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13" r="3.3"></circle>',
    sun: '<circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>',
    moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
    grid: '<rect x="3" y="3" width="7" height="7" rx="1.2"></rect><rect x="14" y="3" width="7" height="7" rx="1.2"></rect><rect x="3" y="14" width="7" height="7" rx="1.2"></rect><rect x="14" y="14" width="7" height="7" rx="1.2"></rect>',
    shelf: '<line x1="3" y1="7" x2="21" y2="7"></line><line x1="3" y1="17" x2="21" y2="17"></line><line x1="6" y1="7" x2="6" y2="17"></line><line x1="12" y1="7" x2="12" y2="17"></line><line x1="18" y1="7" x2="18" y2="17"></line>'
  };
  function icon(name, size){
    size = size || 20;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]||""}</svg>`;
  }

  /* ---------------- State ---------------- */
  let state = loadState();
  let activeTab = "library";
  let openItemId = null;
  let manualCoverData = null;   // dataURL pendiente para el alta manual
  let scanResult = null;        // {title, volume, confidence} tras leer un ISBN
  let scanMatches = [];         // resultados de AniList tras la búsqueda
  let scanSelectedMatch = null;

  function loadState(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
      // migración desde versiones anteriores
      for(const legacyKey of ["tomo_manga_data_v2","tomo_manga_data_v1"]){
        const legacy = localStorage.getItem(legacyKey);
        if(legacy){
          const parsed = JSON.parse(legacy);
          (parsed.items||[]).forEach(i=>{ i.id = String(i.id); i.source = i.source || "anilist"; });
          return parsed;
        }
      }
    }catch(e){ console.warn("No se pudo leer el almacenamiento local", e); }
    return { items: [] };
  }
  function saveState(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }catch(e){
      toast("No se pudo guardar (¿almacenamiento lleno?)");
    }
    renderStats();
  }

  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove("show"), 2400);
  }

  /* ---------------- Color identity per series ---------------- */
  function hashHue(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
    return h % 360;
  }
  function itemColor(item){
    const hue = hashHue(String(item.title||item.id));
    return `hsl(${hue} 78% 58%)`;
  }
  function itemColorDark(item){
    const hue = hashHue(String(item.title||item.id));
    return `hsl(${hue} 55% 22%)`;
  }
  // Versión del color de la serie pensada para texto/bordes directamente sobre el
  // fondo de la página (donde el contraste sí importa según el tema activo).
  function itemTextColor(item){
    const hue = hashHue(String(item.title||item.id));
    return currentTheme()==="light" ? `hsl(${hue} 75% 36%)` : `hsl(${hue} 80% 64%)`;
  }

  /* ---------------- Tema claro / oscuro ---------------- */
  const THEME_STORE = "tomo_theme";
  function currentTheme(){
    return document.documentElement.getAttribute("data-theme") || "light";
  }
  function applyTheme(theme){
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem(THEME_STORE, theme);
    const meta = document.getElementById("themeColorMeta");
    if(meta) meta.setAttribute("content", theme==="light" ? "#FAF7F2" : "#0B0B0F");
  }
  function initTheme(){
    const saved = localStorage.getItem(THEME_STORE);
    applyTheme(saved === "dark" || saved === "light" ? saved : "light");
  }
  function toggleTheme(){
    applyTheme(currentTheme()==="light" ? "dark" : "light");
    render();
    if(openItemId==="menu") openMenuSheet();
  }
  function initialsOf(title){
    return (title||"?").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  }

  /* ---------------- AniList API ---------------- */
  async function anilistQuery(query, variables){
    const res = await fetch(ANILIST_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ query, variables })
    });
    if(!res.ok) throw new Error("AniList error " + res.status);
    const json = await res.json();
    if(json.errors) throw new Error(json.errors[0]?.message || "AniList error");
    return json.data;
  }

  async function searchManga(term){
    const query = `
      query ($search: String) {
        Page(perPage: 12) {
          media(search: $search, type: MANGA, sort: POPULARITY_DESC) {
            id
            title { romaji english native }
            coverImage { large medium }
            status
            format
            volumes
            chapters
            startDate { year month day }
          }
        }
      }`;
    const data = await anilistQuery(query, { search: term });
    return data.Page.media;
  }

  // Búsqueda en MangaUpdates (base de datos comunitaria centrada solo en manga/manhwa/manhua),
  // normalizada al mismo formato que usan los resultados de AniList para poder
  // reutilizar todo el resto del código (tarjetas, alta en biblioteca, etc.).
  async function searchMangaUpdates(term){
    try{
      const res = await fetch("https://api.mangaupdates.com/v1/series/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ search: term, page: 1, perpage: 8 })
      });
      if(!res.ok) return [];
      const data = await res.json();
      const results = data.results || data.data || [];
      return results.map(r=>{
        const rec = r.record || r;
        const id = rec.series_id || rec.id;
        const title = rec.title || rec.name;
        if(!id || !title) return null;
        const cover = (rec.image && rec.image.url && (rec.image.url.original || rec.image.url.thumb)) || "";
        const year = rec.year ? parseInt(rec.year, 10) : null;
        return {
          id: "mu-" + id,
          title: { romaji: title, english: title, native: title },
          coverImage: { large: cover, medium: cover },
          status: rec.completed ? "FINISHED" : "RELEASING",
          volumes: null,
          chapters: null,
          startDate: year ? { year, month: null, day: null } : null,
          _source: "mangaupdates"
        };
      }).filter(Boolean);
    }catch(e){
      // Si MangaUpdates falla (red, CORS, formato inesperado) seguimos solo con AniList
      // en vez de romper la búsqueda entera.
      return [];
    }
  }

  async function searchAllSources(term){
    const [anilistRes, muRes] = await Promise.allSettled([searchManga(term), searchMangaUpdates(term)]);
    const anilist = anilistRes.status==="fulfilled" ? anilistRes.value : [];
    const mu = muRes.status==="fulfilled" ? muRes.value : [];
    return [...anilist, ...mu];
  }

  async function fetchMediaById(numericId){
    const query = `
      query ($id: Int) {
        Media(id: $id, type: MANGA) {
          id
          title { romaji english native }
          coverImage { large medium }
          status
          format
          volumes
          chapters
          startDate { year month day }
        }
      }`;
    const data = await anilistQuery(query, { id: numericId });
    return data.Media;
  }

  function bestTitle(t){ return (t && (t.english || t.romaji || t.native)) || "Sin título"; }

  function statusLabel(s){
    return {
      RELEASING: "En emisión", FINISHED: "Completo", NOT_YET_RELEASED: "Aún no publicado",
      CANCELLED: "Cancelado", HIATUS: "En pausa", CUSTOM: "Añadido a mano"
    }[s] || s || "—";
  }
  function fmtDate(d){
    if(!d || !d.year) return null;
    const months = ["","ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    return `${d.day || "?"} ${months[d.month]||""} ${d.year}`;
  }

  /* ---------------- Item helpers ---------------- */
  function findItem(id){ return state.items.find(i => i.id === id); }
  function uid(){ return "custom-" + Date.now() + "-" + Math.random().toString(36).slice(2,8); }

  function mediaToItem(media){
    return {
      id: String(media.id),
      source: media._source || "anilist",
      title: bestTitle(media.title),
      cover: (media.coverImage && (media.coverImage.large || media.coverImage.medium)) || "",
      status: media.status,
      totalVolumes: media.volumes || null,
      totalChapters: media.chapters || null,
      chaptersKnown: media.chapters || 0,
      startDate: media.startDate && media.startDate.year ? media.startDate : null,
      inLibrary: false,
      inWishlist: false,
      volumeStates: media.volumes && media.volumes <= 200 ? new Array(media.volumes).fill(0) : null,
      ownedCount: 0,
      readCount: 0,
      manualNextDate: "",
      manualNote: "",
      edition: "",
      newChaptersCount: 0,
      addedAt: Date.now()
    };
  }

  function addToLibrary(media){
    let item = findItem(String(media.id));
    if(!item){ item = mediaToItem(media); state.items.push(item); }
    item.inLibrary = true;
    saveState();
    toast(`"${item.title}" añadido a tu biblioteca`);
    render();
    return item;
  }
  function addToWishlist(media){
    let item = findItem(String(media.id));
    if(!item){ item = mediaToItem(media); state.items.push(item); }
    item.inWishlist = true;
    saveState();
    toast(`"${item.title}" añadido a la wishlist`);
    render();
    return item;
  }
  function removeItem(id){
    const item = findItem(id);
    if(!item) return;
    state.items = state.items.filter(i => i.id !== id);
    saveState();
    closeSheet();
    render();
    toast(`"${item.title}" eliminado`);
  }
  function moveToLibrary(id){
    const item = findItem(id);
    item.inLibrary = true;
    item.inWishlist = false;
    saveState();
    toast(`"${item.title}" movido a tu biblioteca`);
    render();
    openSheet(id);
  }

  function cycleVolume(id, idx){
    const item = findItem(id);
    if(!item || !item.volumeStates) return;
    item.volumeStates[idx] = (item.volumeStates[idx] + 1) % 3;
    saveState();
    renderItemSheet(item);
    renderActiveTabList();
  }
  function bumpCounter(id, field, delta){
    const item = findItem(id);
    if(!item) return;
    item[field] = Math.max(0, (item[field]||0) + delta);
    if(field === "readCount" && item.ownedCount < item.readCount) item.ownedCount = item.readCount;
    saveState();
    renderItemSheet(item);
    renderActiveTabList();
  }
  function dismissNewChapters(id){
    const item = findItem(id);
    if(!item) return;
    item.chaptersKnown = item.totalChapters || item.chaptersKnown;
    item.newChaptersCount = 0;
    saveState();
    render();
  }

  async function refreshAll(){
    const trackable = state.items.filter(i=>i.source==="anilist");
    if(!trackable.length){ toast("No hay series de AniList que actualizar"); return; }
    toast("Actualizando desde AniList…");
    let updated = 0, newChapters = 0, failed = 0;
    for(const item of trackable){
      try{
        const media = await fetchMediaById(Number(item.id));
        if(!media) continue;
        item.status = media.status;
        item.totalVolumes = media.volumes || item.totalVolumes;
        const prevKnownTotal = item.totalChapters || 0;
        item.totalChapters = media.chapters || item.totalChapters;
        item.startDate = (media.startDate && media.startDate.year) ? media.startDate : item.startDate;
        if(item.totalChapters && item.totalChapters > (item.chaptersKnown||0)){
          item.newChaptersCount = item.totalChapters - (item.chaptersKnown||0);
          if(item.totalChapters > prevKnownTotal) newChapters++;
        }
        updated++;
      }catch(e){ failed++; }
    }
    saveState();
    render();
    if(failed && !updated) toast("No se pudo conectar con AniList. Revisa tu conexión.");
    else toast(`Actualizado (${updated}) · ${newChapters} con capítulos nuevos${failed?` · ${failed} fallidos`:""}`);
  }

  /* ---------------- Image helpers ---------------- */
  function resizeImageFile(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const img = new Image();
      const reader = new FileReader();
      reader.onload = () => { img.src = reader.result; };
      reader.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if(width > height){ if(width > maxDim){ height = Math.round(height * maxDim/width); width = maxDim; } }
        else { if(height > maxDim){ width = Math.round(width * maxDim/height); height = maxDim; } }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality || 0.82));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ---------------- Export / Import ---------------- */
  function exportData(){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "tomo-backup.json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  function importData(file){
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.items)) throw new Error("formato inválido");
        parsed.items.forEach(i=>{ i.id = String(i.id); i.source = i.source || "anilist"; });
        state = parsed;
        saveState();
        render();
        toast("Copia importada correctamente");
      }catch(e){ toast("El archivo no es una copia válida"); }
    };
    reader.onerror = () => toast("No se pudo leer el archivo");
    reader.readAsText(file);
  }

  /* ---------------- Render: shell ---------------- */
  function renderStats(){
    const lib = state.items.filter(i=>i.inLibrary);
    const wish = state.items.filter(i=>i.inWishlist);
    const newChaps = lib.filter(i=>i.newChaptersCount>0).length;
    const row = document.getElementById("statsRow");
    row.innerHTML = `
      <div class="stat-chip"><b>${lib.length}</b>en biblioteca</div>
      <div class="stat-chip"><b>${wish.length}</b>en wishlist</div>
      <div class="stat-chip"><b>${newChaps}</b>con capítulos nuevos</div>
    `;
    const hasUpcomingNews = newChaps>0 || lib.some(i=>i.status==="NOT_YET_RELEASED");
    const navUpcomingBtn = document.querySelector('.bottomnav button[data-tab="upcoming"]');
    if(navUpcomingBtn){
      let dot = navUpcomingBtn.querySelector(".nav-dot");
      if(hasUpcomingNews && !dot){
        dot = document.createElement("span");
        dot.className = "nav-dot";
        navUpcomingBtn.appendChild(dot);
      }else if(!hasUpcomingNews && dot){
        dot.remove();
      }
    }
  }

  function posterHTML(item, idx){
    const color = itemColor(item);
    const dark = itemColorDark(item);
    const initials = initialsOf(item.title);
    const cover = item.cover
      ? `<img src="${item.cover}" alt="" loading="lazy" onload="this.classList.add('loaded')" onerror="this.style.display='none'">`
      : "";
    const placeholder = `<div class="poster-placeholder" style="background:linear-gradient(160deg, ${color}, ${dark})">${initials}</div>`;
    const pct = item.totalVolumes
      ? Math.round(((item.volumeStates ? item.volumeStates.filter(s=>s===2).length : item.readCount) / item.totalVolumes) * 100)
      : null;
    return `
      <div class="poster" data-open="${item.id}" style="box-shadow:0 6px 22px -8px ${color}66; --i:${Math.min(idx||0,12)};">

  function spineStripHTML(items){
    if(items.length < 4) return "";
    const spines = items.map(i=>{
      const h = 14 + (hashHue(String(i.title||i.id)) % 100) % 24; // altura variable, look orgánico
      return `<div class="spine" style="height:${h}px; background:${itemColor(i)};"></div>`;
    }).join("");
    return `<p class="spine-strip-label">Tu estantería, de un vistazo</p><div class="spine-strip">${spines}</div>`;
  }

  const EMPTY_ILLUSTRATION = `<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path><line x1="9" y1="7" x2="15" y2="7"></line><line x1="9" y1="11" x2="14" y2="11"></line></svg>`;

  const LIBRARY_VIEW_STORE = "tomo_library_view";
  function getLibraryView(){
    const v = localStorage.getItem(LIBRARY_VIEW_STORE);
    return (v === "shelf" || v === "grid") ? v : "grid";
  }
  function setLibraryView(v){
    localStorage.setItem(LIBRARY_VIEW_STORE, v);
    renderActiveTabList();
  }

  function buildSpineList(items){
    const spines = [];
    items.forEach(item=>{
      if(item.volumeStates){
        item.volumeStates.forEach((s, idx)=>{ if(s>0) spines.push({ item, vol: idx+1, read: s===2 }); });
      }else if((item.ownedCount||0) > 0){
        for(let v=1; v<=item.ownedCount; v++) spines.push({ item, vol: v, read: v<=(item.readCount||0) });
      }else{
        spines.push({ item, vol: null, read: false });
      }
    });
    return spines;
  }

  function spineHTML(s){
    const item = s.item;
    const color = itemColor(item);
    const dark = itemColorDark(item);
    const heightSeed = hashHue(item.title + "h" + (s.vol||0));
    const height = 92 + (heightSeed % 55);
    const widthSeed = hashHue(item.id + "w");
    const width = 25 + (widthSeed % 11);
    const shortTitle = item.title.length > 16 ? item.title.slice(0,15) + "…" : item.title;
    return `
      <div class="spine-book" data-open="${item.id}" style="height:${height}px; width:${width}px; background:linear-gradient(180deg, ${color}, ${dark}); ${s.read ? "" : "opacity:.8;"}">
        ${item.edition ? `<span class="spine-book-edition">${item.edition}</span>` : ""}
        <span class="spine-book-title">${shortTitle}</span>
        ${s.vol ? `<span class="spine-book-vol">${s.vol}</span>` : ""}
      </div>`;
  }

  function renderShelf(items){
    const spines = buildSpineList(items);
    const perRow = 8;
    let html = "";
    for(let i=0; i<spines.length; i+=perRow){
      html += `<div class="shelf-row">${spines.slice(i, i+perRow).map(spineHTML).join("")}</div><div class="shelf-board"></div>`;
    }
    return `<p class="shelf-hint">Toca un lomo para abrir ese tomo</p>${html}`;
  }

  function upThumb(item){

  function renderUpcoming(){
    const tracked = state.items.filter(i=>i.inLibrary || i.inWishlist);

    html += `<p class="section-sub">AniList no da fechas exactas de tomo físico para series en curso — aquí verás series anunciadas sin publicar, capítulos ya salidos que aún no has leído, y puedes anotar tú la fecha de un próximo tomo físico.</p>`;

  function render(){

    if(activeTab==="library") main.innerHTML = renderLibrary();

    else if(activeTab==="upcoming") main.innerHTML = renderUpcoming();

  async function doSearch(){
    const input = document.getElementById("searchInput");
    const term = input.value.trim();
    if(!term) return;
    const resultsEl = document.getElementById("searchResults");
    resultsEl.innerHTML = `<div class="loading"><div class="spinner"></div>Buscando en AniList…</div>`;
    try{
      const media = await searchAllSources(term);
      searchResultsCache = media;
      resultsEl.innerHTML = media.length ? media.map(resultCardHTML).join("")
        : `<div class="empty"><b>Sin resultados</b>Prueba con otro título, en su idioma original, o añádelo a mano.</div>`;
    }catch(e){
      resultsEl.innerHTML = `<div class="empty"><b>No se pudo conectar con AniList</b>Comprueba tu conexión e inténtalo de nuevo.</div>`;
    }

      }).join("");

      return `
        <p class="vol-hint">Toca un tomo para marcarlo: vacío → comprado → leído · ${read}/${item.volumeStates.length} leídos</p>

  function renderBarcodeSheet(){
    const content = document.getElementById("sheetContent");
    content.innerHTML = `
      <button class="sheet-close" data-action="close-sheet" aria-label="Cerrar">${icon("close",15)}</button>

      <div id="barcodeArea"></div>
    `;

  // Lector de códigos de barras vía cámara del navegador (funciona en cualquier
  // móvil moderno con permiso de cámara, sin depender de una app nativa compilada).
  const ZXING_CDN = "https://unpkg.com/@zxing/browser@latest";
  let zxingScanControls = null;

  function ensureZXing(){
    if(window.ZXingBrowser) return Promise.resolve(window.ZXingBrowser);
    if(ensureZXing._pending) return ensureZXing._pending;
    ensureZXing._pending = new Promise((resolve, reject)=>{
      const s = document.createElement("script");
      s.src = ZXING_CDN;
      s.onload = ()=> window.ZXingBrowser ? resolve(window.ZXingBrowser) : reject(new Error("No se pudo iniciar el lector de códigos."));
      s.onerror = ()=> reject(new Error("No se pudo cargar el lector de códigos (revisa tu conexión)."));
      document.head.appendChild(s);
    });
    return ensureZXing._pending;
  }

  async function startCameraScan(){
    const area = document.getElementById("cameraArea");
    if(!area) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast("Este navegador no permite usar la cámara aquí.");
      return;
    }
    area.innerHTML = `
      <div class="camera-wrap">
        <video id="scanVideo" autoplay playsinline muted></video>
        <div class="scan-guide"></div>
      </div>
      <p class="camera-hint">Encuadra el código de barras dentro del recuadro</p>
      <div class="sheet-actions"><button data-action="stop-camera-scan">Cancelar</button></div>
    `;
    try{
      const ZB = await ensureZXing();
      const videoEl = document.getElementById("scanVideo");
      if(!videoEl) return; // se canceló mientras cargaba la librería
      const reader = new ZB.BrowserMultiFormatReader();
      const BOOK_FORMATS = new Set([ZB.BarcodeFormat.EAN_13, ZB.BarcodeFormat.EAN_8, ZB.BarcodeFormat.UPC_A, ZB.BarcodeFormat.UPC_E]);
      zxingScanControls = await reader.decodeFromConstraints(
        { video: { facingMode: { ideal: "environment" } } },
        videoEl,
        (result)=>{
          if(!result) return;
          // Ignora códigos que no sean de tipo "libro" (por ejemplo QR promocionales
          // u otros códigos de la contraportada) y sigue escaneando.
          if(!BOOK_FORMATS.has(result.getBarcodeFormat())) return;
          const text = result.getText();
          stopCameraScan();
          lookupIsbn(text, document.getElementById("barcodeArea"));
        }
      );
    }catch(e){
      area.innerHTML = `<p class="section-sub">No se pudo acceder a la cámara (¿diste permiso en el navegador?). Puedes escribir el ISBN a mano abajo.</p>`;
    }
  }

  function stopCameraScan(){
    try{ if(zxingScanControls){ zxingScanControls.stop(); zxingScanControls = null; } }catch(e){}
    const area = document.getElementById("cameraArea");
    if(area) area.innerHTML = "";
  }

  function lookupManualIsbn(){
    const val = document.getElementById("manualIsbnInput").value.trim().replace(/[^0-9Xx]/g,"");
    if(!val){ toast("Escribe un ISBN primero"); return; }
    lookupIsbn(val, document.getElementById("barcodeArea"));
  }

  async function lookupIsbn(isbn, area){
    area.innerHTML = `<div class="loading"><div class="spinner"></div>Buscando el ISBN ${isbn}…</div>`;
    let bookTitle = null;
    let source = null;
    let rateLimited = false;

    async function tryGoogleBooks(){
      const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${encodeURIComponent(isbn)}`);
      if(res.status === 429){ rateLimited = true; return; }
      if(!res.ok) return;
      const data = await res.json();
      const info = data.items && data.items[0] && data.items[0].volumeInfo;
      if(info && info.title){ bookTitle = info.title + (info.subtitle ? " " + info.subtitle : ""); source = "Google Books"; }
    }

    try{ await tryGoogleBooks(); }catch(e){ /* seguimos e intentamos con la siguiente fuente */ }

    // Si nos limitó por peticiones, esperamos un segundo y lo intentamos una vez más
    // antes de rendirnos (evita que un 429 puntual parezca un "no encontrado").
    if(!bookTitle && rateLimited){
      rateLimited = false;
      await new Promise(r=>setTimeout(r, 1200));
      try{ await tryGoogleBooks(); }catch(e){ /* seguimos igualmente */ }
    }

    // Si Google Books no lo tiene, probamos con Open Library como segunda fuente
    // (cubre bastantes ediciones que a Google Books le faltan).
    if(!bookTitle){
      try{
        const res2 = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${encodeURIComponent(isbn)}&format=json&jscmd=data`);
        if(res2.status === 429) rateLimited = true;
        const data2 = await res2.json();
        const entry = data2[`ISBN:${isbn}`];
        if(entry && entry.title){ bookTitle = entry.title; source = "Open Library"; }
      }catch(e){ /* seguimos igualmente */ }
    }

    // Intenta extraer un número de tomo del título del libro (ej. "Vol. 12", "Tomo 3")
    let volumeGuess = null;
    if(bookTitle){
      const m = bookTitle.match(/(?:vol(?:ume)?|tomo|t\.)\s*\.?\s*(\d+)/i);
      if(m) volumeGuess = parseInt(m[1], 10);
    }
    // Título limpio para buscar la serie (quita "Vol. X", números sueltos al final,
    // subtítulos entre paréntesis, etc.)
    function stripVolumeNoise(t){
      return t
        .replace(/\s*[\(\[][^)\]]*\d[^)\]]*[\)\]]\s*$/, "") // ej. "(Naruto, #4)" al final
        .replace(/[,:]?\s*(?:vol(?:ume)?|tomo|t\.?|book|bk\.?|#)\s*\.?\s*#?\d+.*$/i, "")
        .replace(/\s*#?\d+\s*$/, "") // número suelto al final, con o sin '#'
        .trim();
    }
    const cleanTitle = stripVolumeNoise(bookTitle || isbn) || (bookTitle || isbn);

    if(!bookTitle){
      const looksLikeIsbn = /^97[89]\d{10}$/.test(isbn.replace(/[^0-9]/g,""));
      const reason = rateLimited
        ? "Los servicios de búsqueda están saturados ahora mismo — prueba de nuevo en un momento."
        : `No aparece en Google Books ni en Open Library.${looksLikeIsbn ? "" : " Este código no tiene pinta de ISBN de libro (¿quizás es otro código de la contraportada, como el de precio? prueba a escanear el otro código)."} Si es de una editorial pequeña o especializada (algo muy típico en manga), es normal que no esté en ninguna de las dos — no es un fallo tuyo.`;
      area.innerHTML = `<div class="empty"><b>ISBN no encontrado</b>${reason} Puedes añadirlo a mano.</div>
        <div class="sheet-actions"><button class="primary" data-action="isbn-to-manual" data-isbn="${isbn}">Añadir a mano</button></div>`;
      return;
    }

    area.innerHTML = `
      <div class="scan-result">
        <b>${bookTitle}</b>
        ${volumeGuess ? `<span class="tag">Tomo ${volumeGuess}</span>` : ""}
        <p class="section-sub" style="margin:6px 0 0;">Encontrado en ${source} · Buscando "${cleanTitle}"…</p>
      </div>
    `;
    scanResult = { title: cleanTitle, volume: volumeGuess, confidence: "high" };
    try{
      let matches = await searchAllSources(cleanTitle);
      // Si no hay resultados, reintenta con una versión aún más simplificada
      // (solo lo que hay antes de la primera coma, dos puntos o paréntesis),
      // por si el título traía ruido (subtítulos, ediciones, etc.).
      if(!matches.length){
        const shorter = cleanTitle.split(/[,:(]/)[0].trim();
        if(shorter && shorter !== cleanTitle && shorter.length >= 2){
          matches = await searchAllSources(shorter);
        }
      }
      scanMatches = matches;
      if(matches.length){
        scanSelectedMatch = matches[0];
        const list = document.createElement("div");
        matches.slice(0,4).forEach((m,idx)=>{
          const row = document.createElement("div");
          row.className = "match-option" + (idx===0 ? " selected" : "");
          row.dataset.action = "select-match";
          row.dataset.idx = idx;
          row.innerHTML = `<img src="${m.coverImage?.medium||''}" alt="" onerror="this.style.visibility='hidden'"><span>${bestTitle(m.title)}<span class="fab-choice-sub">${m._source==="mangaupdates"?"MangaUpdates":"AniList"}</span></span>`;
          list.appendChild(row);
        });
        area.appendChild(list);
        const actions = document.createElement("div");
        actions.className = "sheet-actions";
        actions.innerHTML = `<button class="primary" data-action="confirm-scan">Añadir a mi biblioteca</button>`;
        area.appendChild(actions);
      }else{
        const actions = document.createElement("div");
        actions.className = "sheet-actions";
        actions.innerHTML = `<button class="primary" data-action="isbn-to-manual" data-isbn="${isbn}">Añadir a mano con este título</button>`;
        area.appendChild(actions);
      }
    }catch(e){
      area.innerHTML += `<p class="section-sub">No se pudo buscar en AniList.</p>`;
    }
  }

  function confirmScanAdd(){
    if(!scanSelectedMatch) return;
    const item = addToLibrary(scanSelectedMatch);
    if(scanResult && scanResult.volume && item.volumeStates && item.volumeStates[scanResult.volume-1] !== undefined){
      item.volumeStates[scanResult.volume-1] = 1; // marcado como comprado
      saveState();
    }else if(scanResult && scanResult.volume){
      item.ownedCount = Math.max(item.ownedCount||0, scanResult.volume);
      saveState();
    }
    closeSheet();
    activeTab = "library";
    document.querySelectorAll(".bottomnav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===activeTab));
    render();
    openSheet(item.id);
  }

  function isbnToManual(){
    closeSheet();
    openManualSheet();
    if(scanResult && scanResult.title){
      setTimeout(()=>{
        const titleInput = document.getElementById("manualTitle");
        if(titleInput) titleInput.value = scanResult.title;
      }, 0);
    }
  }

  /* ---------------- Chrome de la app: cabecera, nav inferior y menú de opciones ---------------- */
  function initChrome(){
    document.getElementById("refreshBtn").innerHTML = icon("refresh", 19);
    document.getElementById("menuBtn").innerHTML = icon("more", 19);
    document.getElementById("fabBtn").innerHTML = icon("plus", 24);

    const navDefs = [
      { tab: "library", label: "Biblioteca", ic: "book" },
      { tab: "wishlist", label: "Wishlist", ic: "star" },
      { tab: "upcoming", label: "Próximos", ic: "calendar" },
      { tab: "search", label: "Buscar", ic: "search" }
    ];
    document.querySelectorAll(".bottomnav button").forEach(btn=>{
      const def = navDefs.find(d=>d.tab===btn.dataset.tab);
      if(def) btn.innerHTML = `<span class="ic">${icon(def.ic, 20)}</span>${def.label}`;
    });
  }

  function openMenuSheet(){
    openItemId = "menu";
    const content = document.getElementById("sheetContent");
    const isLight = currentTheme()==="light";
    content.innerHTML = `
      <button class="sheet-close" data-action="close-sheet" aria-label="Cerrar">${icon("close",15)}</button>
      <p class="sheet-heading">Más opciones</p>
      <button class="menu-item" data-action="toggle-theme">${icon(isLight ? "moon" : "sun",19)} ${isLight ? "Modo oscuro" : "Modo claro"}</button>
      <button class="menu-item" data-action="do-export">${icon("download",19)} Exportar copia de seguridad</button>
      <button class="menu-item" data-action="do-import">${icon("upload",19)} Importar copia de seguridad</button>
      <button class="menu-item" data-action="do-about">${icon("info",19)} Acerca de Tomo</button>
      <p class="app-version">Tomo · datos guardados solo en este dispositivo</p>
    `;
    showSheet();
  }

  function showAboutSheet(){
    const content = document.getElementById("sheetContent");
    content.innerHTML = `
      <button class="sheet-close" data-action="close-sheet" aria-label="Cerrar">${icon("close",15)}</button>
      <p class="sheet-heading">Acerca de Tomo</p>
      <p class="section-sub" style="margin-top:0; line-height:1.6;">
        Tomo lleva el control de tu colección de manga: qué tienes, qué tomos has leído, qué quieres pillar y qué se anuncia próximamente. Los datos de las series vienen de AniList; tu colección se guarda solo en este dispositivo — usa "Exportar copia de seguridad" para no perderla.
      </p>
    `;
  }

  function openAddSheet(){
    openItemId = "add";
    const content = document.getElementById("sheetContent");
    content.innerHTML = `
      <button class="sheet-close" data-action="close-sheet" aria-label="Cerrar">${icon("close",15)}</button>
      <p class="sheet-heading">Añadir un manga</p>
      <button class="fab-choice" data-action="add-via-search">
        <span class="fab-choice-ic">${icon("search",19)}</span>
        <span>Buscar en AniList<span class="fab-choice-sub">La forma más rápida para la mayoría de series</span></span>
      </button>
      <button class="fab-choice" data-action="add-via-barcode">
        <span class="fab-choice-ic">${icon("barcode",19)}</span>
        <span>Código de barras<span class="fab-choice-sub">Escanea el ISBN del tomo físico</span></span>
      </button>
      <button class="fab-choice" data-action="add-via-manual">
        <span class="fab-choice-ic">${icon("pencil",19)}</span>
        <span>Añadir a mano<span class="fab-choice-sub">Para ediciones que AniList no tenga</span></span>
      </button>
    `;
    showSheet();
  }

  /* ---------------- Event delegation ---------------- */
  document.addEventListener("click", (e)=>{
    const poster = e.target.closest("[data-open]");
    if(poster){ openSheet(poster.dataset.open); return; }

    const t = e.target.closest("[data-action]");
    if(!t) return;
    const action = t.dataset.action;
    const id = t.dataset.id != null ? t.dataset.id : null;

    if(action==="cycle") cycleVolume(id, Number(t.dataset.idx));
    else if(action==="inc") bumpCounter(id, t.dataset.field, 1);
    else if(action==="dec") bumpCounter(id, t.dataset.field, -1);
    else if(action==="dismiss-chap"){ dismissNewChapters(id); if(openItemId===id) closeSheet(); }
    else if(action==="remove") removeItem(id);
    else if(action==="move-lib") moveToLibrary(id);
    else if(action==="close-sheet") closeSheet();
    else if(action==="add-lib"){
      const media = searchResultsCache.find(m=>String(m.id)===id);
      if(media) addToLibrary(media);
    }
    else if(action==="add-wish"){
      const media = searchResultsCache.find(m=>String(m.id)===id);
      if(media) addToWishlist(media);
    }
    else if(action==="open-manual") openManualSheet();
    else if(action==="open-barcode") openBarcodeSheet();
    else if(action==="start-camera-scan") startCameraScan();
    else if(action==="stop-camera-scan") stopCameraScan();
    else if(action==="lookup-manual-isbn") lookupManualIsbn();
    else if(action==="isbn-to-manual") isbnToManual();
    else if(action==="manual-save") saveManualItem();
    else if(action==="select-match"){
      const idx = Number(t.dataset.idx);
      scanSelectedMatch = scanMatches[idx];
      document.querySelectorAll(".match-option").forEach(el=>el.classList.remove("selected"));
      t.classList.add("selected");
    }
    else if(action==="confirm-scan") confirmScanAdd();
    else if(action==="do-export"){ exportData(); closeSheet(); }
    else if(action==="do-import"){ document.getElementById("fileImport").click(); }
    else if(action==="do-about") showAboutSheet();
    else if(action==="toggle-theme") toggleTheme();
    else if(action==="set-view") setLibraryView(t.dataset.view);
    else if(action==="add-via-search"){
      closeSheet();
      activeTab = "search";
      document.querySelectorAll(".bottomnav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===activeTab));
      render();
      setTimeout(()=>{ const inp = document.getElementById("searchInput"); if(inp) inp.focus(); }, 250);
    }
    else if(action==="add-via-barcode"){ closeSheet(); openBarcodeSheet(); }
    else if(action==="add-via-manual"){ closeSheet(); openManualSheet(); }
  });

  document.getElementById("sheetBackdrop").addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeSheet(); });

  document.addEventListener("change", (e)=>{
    const t = e.target;
    if(t.id === "manualCoverInput" && t.files[0]){
      resizeImageFile(t.files[0], 500, 0.85).then(dataUrl=>{
        manualCoverData = dataUrl;
        const preview = document.getElementById("manualCoverPreview");
        if(preview){ preview.src = dataUrl; preview.style.display = "block"; }
      });
      return;
    }
    if(t.dataset && t.dataset.action==="set-date"){
      const item = findItem(t.dataset.id);
      if(item){ item.manualNextDate = t.value; saveState(); if(activeTab==="upcoming") renderActiveTabList(); }
    }
  });
  document.addEventListener("input", (e)=>{
    const t = e.target;
    if(t.dataset && t.dataset.action==="set-note"){
      const item = findItem(t.dataset.id);
      if(item){ item.manualNote = t.value; saveState(); }
    }
    if(t.dataset && t.dataset.action==="set-edition"){
      const item = findItem(t.dataset.id);
      if(item){ item.edition = t.value; saveState(); renderActiveTabList(); }
    }
  });

  document.querySelectorAll(".bottomnav button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      activeTab = btn.dataset.tab;
      document.querySelectorAll(".bottomnav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===activeTab));
      render();
      window.scrollTo(0,0);
    });
  });

  document.getElementById("refreshBtn").addEventListener("click", refreshAll);
  document.getElementById("menuBtn").addEventListener("click", openMenuSheet);
  document.getElementById("fabBtn").addEventListener("click", openAddSheet);
  document.getElementById("fileImport").addEventListener("change", (e)=>{
    if(e.target.files[0]) importData(e.target.files[0]);
    e.target.value = "";
  });

  initTheme();
  initChrome();
  render();
})();
</script>
</body>
</html>
